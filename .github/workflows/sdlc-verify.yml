name: SDLC verify
# Generated by the SDLC agent pipeline. The authoritative quality gate already
# ran locally (real exit codes, human-approved); this workflow re-verifies the
# same install/build/test on a clean runner as the PR's visible evidence.
#
# `on: push` (every branch), deliberately NOT pull_request: the coding-stage
# push triggers the run MINUTES before go-live, so when the PR opens its head
# SHA already carries a completed green check — no spinner in front of the
# client, and no duplicate pull_request run racing the merge.
on: push
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify packages
        shell: bash
        run: |
          set -uo pipefail
          overall=0
          found=0
          summary()( echo "$1" >> "$GITHUB_STEP_SUMMARY" )
          summary "## SDLC verify"
          # Node packages: every package.json outside node_modules, depth <= 3.
          while IFS= read -r pkg; do
            dir=$(dirname "$pkg")
            found=1
            echo "── verifying $dir"
            pushd "$dir" >/dev/null
            npm install --no-audit --no-fund || { overall=1; summary "- ❌ $dir: install failed"; popd >/dev/null; continue; }
            npm run build --if-present || { overall=1; summary "- ❌ $dir: build failed"; popd >/dev/null; continue; }
            npm test --if-present || { overall=1; summary "- ❌ $dir: tests failed"; popd >/dev/null; continue; }
            summary "- ✅ $dir: install · build · test"
            popd >/dev/null
          done < <(find . -maxdepth 3 -name package.json -not -path '*/node_modules/*')
          # Python fallback.
          if [ "$found" = 0 ] && [ -f requirements.txt ]; then
            found=1
            pip install -r requirements.txt || overall=1
            if [ -d tests ] || ls test_*.py >/dev/null 2>&1; then
              pip install pytest && pytest || overall=1
            fi
            [ "$overall" = 0 ] && summary "- ✅ python: install · test" || summary "- ❌ python: failed"
          fi
          [ "$found" = 0 ] && summary "- ℹ️ no recognized package manifest — nothing to verify"
          exit "$overall"
